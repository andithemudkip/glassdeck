; can-logger — Phase 1 listen-only CAN logger for the Husqvarna Svartpilen 401.
; See firmware/can-logger/README.md and the ADRs under docs/decisions/.

[platformio]
default_envs = logger
src_dir = main

[env]
platform = espressif32 @ 7.0.1
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200

; SLCAN goes out the port labelled USB on the DevKitC-1 (native USB-Serial/JTAG
; on GPIO19/20). esptool talks to that same port. The other port (labelled UART
; or COM depending on board revision — USB-to-UART bridge) is unused by this
; firmware.

[env:logger]
build_flags = -DCAN_BITRATE_KBPS=500

[env:logger-250k]
; Fallback build for the documented 250 kbps possibility. Use only if the
; default 500 kbps build sees a silent bus on the bike.
build_flags = -DCAN_BITRATE_KBPS=250
