; wifi-bridge — Phase 2+ untethered CAN capture + browser-served live view.
; See firmware/wifi-bridge/README.md and docs/decisions/0016-wifi-dev-capture-and-live-view.md.
;
; Milestone 1 scope: TWAI RX + SLCAN emit over USB-CDC, powered from USB at the
; desk. WiFi / HTTP / WebSocket / PSRAM ring land in milestones 2–4.

[platformio]
default_envs = wifi-bridge
src_dir = main

[env]
platform = espressif32 @ 7.0.1
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
; Shared components live in firmware/lib/{twai,slcan}/, discovered by ESP-IDF
; via EXTRA_COMPONENT_DIRS in CMakeLists.txt. Disable PlatformIO's own LDF so
; it doesn't try to build those sources a second time.
lib_ldf_mode = off

[env:wifi-bridge]
build_flags = -DCAN_BITRATE_KBPS=500
; OTA-capable partition table (2× 3 MB app slots). See partitions.csv.
; PlatformIO's own board_build.partitions is the correct entry point —
; setting CONFIG_PARTITION_TABLE_CUSTOM_FILENAME in sdkconfig.defaults alone
; is silently ignored under PIO's ESP-IDF integration.
board_build.partitions = partitions.csv
; Teach SCons about the browser-UI partials so incremental builds trigger a
; ninja/CMake reconfigure when they change. See pio_index_deps.py.
extra_scripts = pre:pio_index_deps.py
