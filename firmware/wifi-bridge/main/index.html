<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glassdeck</title>
<style>
/* __INCLUDE: ui/styles.css */
</style>
</head>
<body>

<header>
  <div class="cell"><span class="k">ws</span><span class="v" id="wsState"><span class="pip" id="wsPip"></span><span id="wsText">…</span></span></div>
  <div class="cell"><span class="k">rssi</span><span class="v" id="rssi">—</span></div>
  <div class="cell"><span class="k">uptime</span><span class="v" id="uptime">—</span></div>
  <div class="cell"><span class="k">twai</span><span class="v" id="twai">—</span></div>
  <div class="cell"><span class="k">frames seen</span><span class="v" id="seen">0</span></div>
  <div class="cell"><span class="k">ws dropped</span><span class="v" id="dropped">0</span></div>
  <div id="liveness"></div>
</header>

<div id="a2hsHint">
  <span>Add to Home Screen to make capture storage durable on iOS (Share → Add to Home Screen).</span>
  <span class="spacer"></span>
  <button id="a2hsDismiss">Dismiss</button>
</div>

<div id="captureBar">
  <button id="captureBtn" class="primary" type="button">Start capture</button>
  <input id="labelIn" class="label-in" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" maxlength="40"
         placeholder="session label (optional)">
  <span id="captureStatus" class="stat" hidden>
    <span class="rec-dot"></span><span class="k">elapsed</span><span id="capElapsed">0:00</span>
    &nbsp;<span class="k">frames</span><span id="capFrames">0</span>
    <span id="capGapsWrap" hidden>&nbsp;<span class="k">gaps</span><span id="capGaps" class="warn">0</span></span>
  </span>
  <span class="spacer"></span>
  <button id="filesBtn" class="ghost" type="button" hidden>Files</button>
  <button id="exportBtn" type="button" hidden>Export</button>
</div>

<main id="mid"></main>

<div id="drawerBackdrop"></div>
<div id="drawer" role="dialog" aria-label="Captures">
  <div class="head">
    <span class="title">Captures</span>
    <span class="count" id="drawerCount"></span>
    <span class="spacer"></span>
    <button id="drawerClose" type="button">Close</button>
  </div>
  <div class="list" id="drawerList"></div>
</div>

<script>
(() => {
/* __INCLUDE: ui/state.js */

/* __INCLUDE: ui/decoder.js */

/* __INCLUDE: ui/capture.js */

/* __INCLUDE: ui/ws.js */

/* __INCLUDE: ui/main.js */
})();
</script>
</body>
</html>
