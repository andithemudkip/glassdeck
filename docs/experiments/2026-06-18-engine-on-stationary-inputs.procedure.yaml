name: engine-on-stationary-inputs
description: >
  Phase A ROAD↔SUPERMOTO toggle, Phase B trip reset, Phase C dash button short
  presses, Phase D throttle blip — bracketed clean windows, auto-marked at
  each phase event.
experiment: 2026-06-18-engine-on-stationary-inputs

# Timing convention: marks fire at STEP START — i.e. the moment the rider is
# cued to begin the action (start of SET hold, start of throttle blip), NOT at
# the dash's visual confirmation. The bus broadcast is keyed off the press
# edge, not the dash redraw, so this is the right reference for analysis.
#
# Holds are generous (≥6 s settle between events, ≥5 s "get ready" before each
# phase) so the rider can reposition between dash work and bike controls
# without rushing. Settle windows comfortably exceed the 100 ms cycle of the
# slowest IDs in the slow-decay group.

steps:
  # ---------------------------------------------------------------- Setup
  - prompt: "Key OFF, kill RUN, neutral, side stand down. Hands off the bike. Recording bus silence."
    duration_secs: 6

  - prompt: "Turn key ON now."
    duration_secs: 30
    countdown_from: 3
    mark: { key: mark, label: "key on" }

  - prompt: "Press the STARTER. Let the engine catch — throttle closed."
    duration_secs: 10
    countdown_from: 3
    mark: { key: start, label: "starter pressed" }

  - prompt: "Idle settling — hands off. Clean 30 s idle baseline window."
    duration_secs: 30
    mark: { key: idle_settled, label: "idle settled (engine on)" }

  # --------------------------------------------------- Phase A — mode toggle
  - prompt: "PHASE A — ROAD↔SUPERMOTO. Use MODE short-presses to reach the ABS screen. Press SPACE on each MODE press. Take your time."
    duration_secs: 30

  - prompt: "Get into position — right wrist OFF the throttle through all of Phase A."
    duration_secs: 8

  - repeat: 4
    steps:
      - prompt: "Hold SET 3–5 s — toggle mode. Wrist OFF the throttle."
        duration_secs: 10
        countdown_from: 3
        mark: { key: mode, label: "mode toggle {iter} of {loop_count} (SET-hold start)" }
      - prompt: "Settle — hands off, let the bus quiet down."
        duration_secs: 8

  # --------------------------------------------------- Phase B — trip reset
  - prompt: "PHASE B — trip reset. Use MODE short-presses to reach Trip 1. SPACE on each press."
    duration_secs: 30

  - prompt: "Get into position — finger on SET, ready to hold."
    duration_secs: 8

  - prompt: "Hold SET 3 s — Trip 1 should jump to 0.0."
    duration_secs: 10
    countdown_from: 3
    mark: { key: trip, label: "trip reset 1 (value-changing, SET-hold start)" }

  - prompt: "Settle — hands off."
    duration_secs: 8

  - prompt: "Hold SET 3 s again — no-op reset (already 0.0)."
    duration_secs: 10
    countdown_from: 3
    mark: { key: trip, label: "trip reset 2 (no-op, SET-hold start)" }

  - prompt: "Settle — hands off."
    duration_secs: 8

  # --------------------------------------------- Phase C — dash short presses
  - prompt: "PHASE C — dash button short presses. We are on Trip 1. SET will cycle Trip 1 sub-menus."
    duration_secs: 8

  - repeat: 4
    steps:
      - prompt: "SET short-press — Trip 1 sub-menu cycle."
        duration_secs: 7
        countdown_from: 3
        mark: { key: mark, label: "SET short Trip1 sub {iter} of {loop_count}" }

  - prompt: "MODE short-press — advance Trip 1 → Trip 2."
    duration_secs: 7
    countdown_from: 3
    mark: { key: mark, label: "MODE short → Trip 2" }

  - repeat: 4
    steps:
      - prompt: "SET short-press — Trip 2 sub-menu cycle."
        duration_secs: 7
        countdown_from: 3
        mark: { key: mark, label: "SET short Trip2 sub {iter} of {loop_count}" }

  - prompt: "MODE short-press — advance Trip 2 → ABS. (SET on ABS would re-toggle mode — DO NOT press SET here.)"
    duration_secs: 7
    countdown_from: 3
    mark: { key: mark, label: "MODE short → ABS" }

  - prompt: "MODE short-press — advance ABS → ODO."
    duration_secs: 7
    countdown_from: 3
    mark: { key: mark, label: "MODE short → ODO" }

  - repeat: 3
    steps:
      - prompt: "SET short-press — ODO sub-menu cycle."
        duration_secs: 7
        countdown_from: 3
        mark: { key: mark, label: "SET short ODO sub {iter} of {loop_count}" }

  - prompt: "Final 8 s hold on ODO — settle the cluster before throttle work."
    duration_secs: 10

  # ----------------------------------------------- Phase D — throttle blip
  - prompt: "PHASE D — throttle blips. Get your right hand on the throttle. Three blips coming, escalating."
    duration_secs: 10

  - prompt: "Small blip (~25 %, ~0.5 s). RPM should rise to ~3000."
    duration_secs: 7
    countdown_from: 3
    mark: { key: throttle, label: "blip 1 small (~25 %)" }

  - prompt: "Medium blip (~50 %, ~0.5 s). RPM to ~5000."
    duration_secs: 7
    countdown_from: 3
    mark: { key: throttle, label: "blip 2 medium (~50 %)" }

  - prompt: "Bigger blip (~75 %, ~0.5 s). RPM to ~7000. DO NOT go to redline."
    duration_secs: 7
    countdown_from: 3
    mark: { key: throttle, label: "blip 3 big (~75 %)" }

  # ----------------------------------------------------------- Shutdown
  - prompt: "Kill switch → STOP. Let decay finish."
    duration_secs: 12
    countdown_from: 3
    mark: { key: kill, label: "kill switch" }

  - prompt: "Key OFF when silent. Hold 3 s of tail silence."
    duration_secs: 6

  - prompt: "Done. Press q to stop capture and fill in session.md."
    duration_secs: null
